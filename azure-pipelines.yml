jobs:
  - job: windows_latest
    pool:
      vmImage: windows-latest
    steps:
      - script: dir
  - job: ubuntu_latest
    pool:
      vmImage: ubuntu-latest
    steps:
      - script: df -H .
  - job: macOS_latest
    pool:
      vmImage: macOS-latest
    steps:
      - script: df -H .
  - job: ubuntu_1es
    pool: azsdk-pool
    steps:
      - bash: |
          set -euo pipefail
    
          echo "=== Mounted filesystems ==="
          df -hT
    
          echo
          echo "=== Disks and partitions ==="
          lsblk -o NAME,SIZE,FSTYPE,FSAVAIL,FSUSE%,MOUNTPOINTS
        displayName: "List disk and mount-point free space"
