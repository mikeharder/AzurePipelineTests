trigger: none

pr:
  branches:
    include:
      - main

strategy:
  matrix:
    # 1ESUbuntu2004:
    #   Pool: "azsdk-pool-mms-ubuntu-2004-general"
    #   OSVmImage: "ubuntu-20.04"
    1ESUbuntu2204:
      Pool: "azsdk-pool"
      OSVmImage: "ubuntu-22.04"
    1ESUbuntu2404:
      Pool: "azsdk-pool"
      OSVmImage: "ubuntu-24.04"
    # 1ESWindows2019:
    #   Pool: "azsdk-pool-mms-win-2019-general"
    #   OSVmImage: "windows-2019"
    # 1ESWindows2022:
    #   Pool: "azsdk-pool"
    #   OSVmImage: "windows-2022"
    # DevOpsUbuntu2004:
    #   Pool: Azure Pipelines
    #   OSVmImage: 'ubuntu-20.04'
    # DevOpsUbuntu2204:
    #   Pool: Azure Pipelines
    #   OSVmImage: "ubuntu-22.04"
    # DevOpsUbuntu2404:
    #   Pool: Azure Pipelines
    #   OSVmImage: "ubuntu-24.04"
    # DevOpsWindows2019:
    #   Pool: Azure Pipelines
    #   OSVmImage: "windows-2019"
    # DevOpsWindows2022:
    #   Pool: Azure Pipelines
    #   OSVmImage: "windows-2022"
    # DevOpsMac11:
    #   Pool: Azure Pipelines
    #   OSVmImage: "macos-11"
    # DevOpsMac12:
    #   Pool: Azure Pipelines
    #   OSVmImage: "macos-12"
    # DevOpsMac13:
    #   Pool: Azure Pipelines
    #   OSVmImage: "macos-13"
    # DevOpsMac13Arm64:
    #   Pool: Azure Pipelines
    #   OSVmImage: "macos-13-arm64"

pool:
  name: $(Pool)
  demands: ImageOverride -equals $(OSVmImage)

variables:
  skipComponentGovernanceDetection: true
  NugetSecurityAnalysisWarningLevel: "none"
  system.debug: true

steps:
  - script: |
      set -x
      sudo apt-get update
      sudo apt-get install -y x11-xserver-utils
      sudo dpkg --configure -a
      sudo apt-get install -y x11-xserver-utils
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))
    displayName: apt-get

  - script: echo $(Agent.OS)
    displayName: print Agent.OS

  - script: uname -m
    displayName: uname -m

  - script: echo Linux
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))
    displayName: Condition Linux

  - script: echo Windows
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'))
    displayName: Condition Windows_NT

  - script: echo Mac
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Darwin'))
    displayName: Condition Darwin
